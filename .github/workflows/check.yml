name: Coolblue Deuxième Chance Tracker

on:
  schedule:
    # Toutes les 5 minutes, en évitant exactement le début de l'heure
    - cron: '2-59/5 * * * *'

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    concurrency:
      group: coolblue-dyson-tracker
      cancel-in-progress: true

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier Coolblue
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG: 'true'
        run: node tracker.js
